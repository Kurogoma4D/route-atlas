<div class="analyze-container">
  <h2>{{ errorMessage() ? 'エラーが発生しました' : '解析中...' }}</h2>

  @if (errorMessage()) {
  <mat-card class="error-card">
    <mat-card-content>
      <mat-icon class="error-icon" color="warn">error</mat-icon>
      <p class="error-message">{{ errorMessage() }}</p>
      <button mat-flat-button (click)="goBack()">
        <mat-icon>arrow_back</mat-icon>
        戻る
      </button>
    </mat-card-content>
  </mat-card>
  } @else {
  <mat-stepper
    [linear]="true"
    [selectedIndex]="currentStepIndex()"
    orientation="vertical"
  >
    @for (step of steps; track step.key) {
    <mat-step [completed]="isStepCompleted(step.key)" [editable]="false">
      <ng-template matStepLabel>
        <span class="step-label">{{ step.label }}</span>
      </ng-template>
      <div class="step-content">
        @if (isStepActive(step.key)) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
        } @else if (isStepCompleted(step.key)) {
        <mat-icon class="step-done-icon">check_circle</mat-icon>
        }
      </div>
    </mat-step>
    }
  </mat-stepper>
  }
</div>
