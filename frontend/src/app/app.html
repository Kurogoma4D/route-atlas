@if (authService.isAuthenticated()) {
<header class="app-header">
  <div class="header-left">
    <span class="app-logo">Route Atlas</span>
  </div>
  <div class="header-right">
    <button mat-icon-button [matMenuTriggerFor]="userMenu" class="avatar-button">
      <img
        class="user-avatar"
        [src]="authService.user()?.avatarUrl"
        [alt]="authService.user()?.login"
      />
    </button>
    <mat-menu #userMenu="matMenu">
      <div class="user-menu-header" mat-menu-item disabled>
        <strong>{{ authService.user()?.login }}</strong>
      </div>
      <button mat-menu-item (click)="onLogout()">
        <mat-icon>logout</mat-icon>
        <span>ログアウト</span>
      </button>
    </mat-menu>
  </div>
</header>
}
<main class="content" [class.full-bleed]="!authService.isAuthenticated()">
  <router-outlet />
</main>
