name = "route-atlas-api"
main = "src/main.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat_v2"]

[vars]
NODE_ENV = "production"
OAUTH_CALLBACK_URL = "https://route-atlas.pages.dev/api/auth/callback"

# KV namespace for session storage
[[kv_namespaces]]
binding = "SESSIONS"
id = "bd19235dec6b43a3815623a534ebcb1a"

# KV namespace for analysis job state
[[kv_namespaces]]
binding = "JOBS"
id = "e34a4739da1047e5993ce88d46415c2d"

# Queue for analysis tasks
[[queues.producers]]
queue = "route-atlas-analyze"
binding = "ANALYZE_QUEUE"

[[queues.consumers]]
queue = "route-atlas-analyze"
max_batch_size = 1
max_retries = 2
